name: 每日更新
on:
  schedule:
    - cron: '30 7 * * 1-5'   # 台北 15:30
    - cron: '30 9 * * 1-5'   # 台北 17:30 補抓（資料晚公布時）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test test/parse.test.js
      - name: 抓最近 7 天（補漏）
        run: node scripts/fetch.js --from "$(TZ=Asia/Taipei date -d '7 days ago' +%F)" --to "$(TZ=Asia/Taipei date +%F)" 2>&1 | tee data/last-run.log
      - run: node build.js
      - name: 提交
        run: |
          git config user.name "stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data dist
          git diff --cached --quiet || (git commit -m "每日更新 $(TZ=Asia/Taipei date +%F)" && git push)
